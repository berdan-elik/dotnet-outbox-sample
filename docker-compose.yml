services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      ConnectionStrings__Orders: Host=db;Port=5432;Database=orders;Username=orders;Password=orders
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
